[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasoundrag"
version = "3.0.0"
description = "UltrasoundRAG - 企业级医学超声RAG系统"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "UltrasoundRAG Team", email = "contact@ultrasoundrag.com"},
]
maintainers = [
    {name = "UltrasoundRAG Team", email = "contact@ultrasoundrag.com"},
]
keywords = ["rag", "ultrasound", "medical", "ai", "retrieval", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    # 核心依赖
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "tqdm>=4.60.0",
    
    # 机器学习
    "torch>=1.9.0",
    "transformers>=4.20.0",
    "sentence-transformers>=2.2.0",
    
    # 向量数据库
    "pymilvus>=2.3.0",
    
    # 图像处理
    "Pillow>=8.0.0",
    "opencv-python>=4.5.0",
    
    # 文档处理
    "markdown>=3.3.0",
    "beautifulsoup4>=4.10.0",
    
    # 配置管理
    "pydantic>=1.8.0",
    "pyyaml>=6.0",
    
    # 工具库
    "jieba>=0.42.0",
    "requests>=2.25.0",
    "pathlib-mate>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "pytest-xdist>=2.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
    "pre-commit>=2.0.0",
    "isort>=5.0.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.17.0",
    "sphinx-autodoc-typehints>=1.12.0",
]
test = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "pytest-mock>=3.6.0",
    "coverage>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/UltrasoundRAG"
Documentation = "https://ultrasoundrag.readthedocs.io/"
Repository = "https://github.com/your-org/UltrasoundRAG"
"Bug Tracker" = "https://github.com/your-org/UltrasoundRAG/issues"
Changelog = "https://github.com/your-org/UltrasoundRAG/blob/main/CHANGELOG.md"

[project.scripts]
ultrasoundrag = "ultrasoundrag.cli.main:main"
rag = "ultrasoundrag.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultrasoundrag*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
ultrasoundrag = [
    "config/*.yaml",
    "config/*.json",
    "*.md",
]

# === 开发工具配置 ===

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除的目录
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__", 
    "build",
    "dist",
    ".venv",
    ".tox",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pymilvus.*",
    "jieba.*",
    "cv2.*",
    "transformers.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=ultrasoundrag",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["ultrasoundrag"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

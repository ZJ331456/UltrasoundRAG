milvus: 
    milvus_uri: "http://localhost:19530"
    milvus_token: "root:Milvus"
    db_name: "ultrasound_vector"
    md_collection_name: "thyroidagent"
    image_collection_name: "images"
    pdf_collection_name: "thesis_papers"
# 索引创建的总配置
indexing:
  db_name: "ultrasound_vector"
  # 图片解析配置
  image_parse:
    model_path: "/media/ps/data-ssd/UltrasoundRAG/UltrasoundRAG/models/fetal-clip/dataset2-pretrain/final_model.pt"
    model_config_path: "/media/ps/data-ssd/UltrasoundRAG/UltrasoundRAG/models/fetal-clip/config.json"

  # Markdown 解析配置
  markdown_parse:
    max_chunk_size: 1500 #单个chunk的大小 
    overlap_ratio: 0.15  #重叠窗口比例，15%可以保持较好的语义连续性
    min_chunk_size: 100  #最小chunk大小，避免过短的无意义片段

  # PDF 解析配置
  pdf_parse:
    max_chunk_size: 1500 #单个chunk的大小 
    overlap_ratio: 0.15  #重叠窗口比例，15%可以保持较好的语义连续性
    min_chunk_size: 100  #最小chunk大小，避免过短的无意义片段 

  markdown:
    # collections: "markdown_index"  # 默认集合名（可被每个数据集的 collection_name 覆盖）
    datasets:
      ultrasound_book:
        enabled: true
        base_md_path: "data/book/markdown"
        collection_name: "normal_book_md"
        description: "超声书籍Markdown数据集"
      ultrasound_guides:
        enabled: false
        base_md_path: ""
        collection_name: "guides_md"
        description: "超声指南Markdown数据集"
      thyroidagent:
        enabled: true
        base_md_path: "/media/ps/data-ssd/UltrasoundRAG/UltrasoundRAG/data/thyroidagent/markdown"
        collection_name: "thyroid_agent_md"
        description: "甲状腺Agent Markdown数据集"
  image:
    # collections: "image_index"  # 默认集合名（可被每个数据集的 collection_name 覆盖）
    datasets:
      ultrasound_book:
        enabled: true
        base_image_path: "/media/ps/data-ssd/UltrasoundRAG/UltrasoundRAG/data/book/image" 
        image_index_path: "image_index.jsonl"
        collection_name: "normal_book_image"
        description: "超声书籍图片数据集"
      ultrasound_clinical: 
        enabled: false
        base_image_path: ""
        image_index_path: ""
        collection_name: "ultrasound_clinical_image"
        description: "临床超声图片数据集"

  # PDF 数据集配置
  pdf:
    datasets:
      thesis_papers:
        enabled: true
        base_pdf_path: "/media/ps/data-ssd/UltrasoundRAG/UltrasoundRAG/data/thesis"
        collection_name: "thesis_papers"
        description: "学术论文PDF数据集"

# Embedding 模型配置
embedding:
  provider: "qwen_embedding" # 通过此名称在下方的 embedding_providers 中查找模型

# 重排序配置
rerank:
  enabled: true  # 是否启用重排序
  
  # 重排序器类型: "model_based" (使用本地Cross-Encoder) 或 "llm_based" (使用大语言模型)
  type: "model_based" 

  # --- model_based reranker config (当 type 为 "model_based") ---
  model_path: "/media/ps/data-ssd/UltrasoundRAG/UltrasoundRAG/models/jina-reranker-v2-base-multilingual"
  top_n: 3 # Reranker返回的结果数
  device: "cuda"  # 或 "cuda"
  batch_size: 1

  # --- llm_based reranker config (当 type 为 "llm_based") ---
  # 在 llm_providers 中定义的LLM provider名称
  llm_provider: "medical_vllm_api" 
  # "basic", "advanced", "explanation", "medical", "auto"
  prompt_type: "auto" 

# 检索器配置
retriever:
  # 基础检索配置
  top_k: 10  # 检索返回的文档数量
  enable_cache: true  # 是否启用缓存
  
  # 向量搜索通用配置
  vector_search:
    search_params:
      nprobe: 16
      metric_type: "COSINE"
      params:
        ef: 200
    batch_size: 64
    enable_parallel: true
  
  # 多数据库和集合配置
  databases:
    default:
      db_name: "ultrasound_vector"
      collections:
        text: "normal_book_md"
        image: "normal_book_image"
      type: "general"
      priority: 1
      enabled: true
      description: "默认数据库：书籍文本+图片"
      tags: ["default", "book"]
        # text: "thyroidagent"  # 文本集合
        # image: "images"       # 图片集合
    normal:
      db_name: "ultrasound_vector"
      collections:
        text: "normal_book_md"
        image: "normal_book_image"
      type: "general"
      priority: 1
      enabled: true
      description: "通用的书籍文本+图片（normal）"
      tags: ["book"]
    md_thyroid:
      db_name: "ultrasound_vector"
      collections:
        text: "thyroid_agent_md"
        image: ""
      type: "general"
      priority: 1
      enabled: true
      description: "甲状腺文本+图片（thyroidagent + image_index）"
      tags: ["thyroid"]
    # 可以添加更多数据库配置
    # medical_specialized:
    #   db_name: "medical_specialist_vector"
    #   collections:
    #     text: "specialist_docs"
    #     image: "specialist_images"
  
  # 检索方式配置
  retrieval_modes:
    # 文本到文本检索（T2T）
    t2t:
      enabled: true
      similarity_threshold: 0.2  # T2T专用阈值
      strategy: "fusion"  # "basic" 或 "fusion"
      fusion_config:
        text_search_ratio: 0.7
        image_caption_ratio: 0.3
        enable_exact_title_match: true
        enable_deduplication: true
        content_similarity_threshold: 0.8
    
    # 文本到图片检索（T2I）
    t2i:
      enabled: true
      similarity_threshold: 0.01  # T2I专用阈值，降低以提升召回率
      use_clip_text_encoder: true  # 使用CLIP文本编码器
      enable_fuzzy_matching: true  # 启用模糊匹配
      use_caption_boost: true      # 利用caption向量提升匹配
      vector_fusion_weights:
        image_vector: 0.7
        caption_vector: 0.3
      
    # 图片到文本检索（I2T）
    i2t:
      enabled: true
      similarity_threshold: 0.15  # I2T专用阈值
      return_caption_as_text: true  # 将caption作为文本结果返回
      
    # 图片到图片检索（I2I）
    i2i:
      enabled: true
      similarity_threshold: 0.2   # I2I专用阈值
      include_metadata: true  # 包含图片元数据
  
  # Caption检索图片模块
  caption_to_image:
    enabled: true
    search_mode: "exact_match"  # "exact_match", "fuzzy_match", "semantic_match"
    fuzzy_threshold: 0.8  # 模糊匹配阈值
    max_results_per_caption: 3  # 每个caption最多返回的图片数
    
  # 融合检索配置
  fusion:
    default_strategy: "weighted"  # "weighted", "interleaved", "score_based"
    weights:
      text: 0.6
      image: 0.4
    enable_multimodal_fusion: true

  # 图片caption向量融合权重（仅 CLIP）
  caption_vector_fusion:
    image_weight: 0.7
    caption_clip_weight: 0.3
  
  # 模型管理配置
  model_management:
    lazy_loading: true
    model_cache_size: 5
    enable_model_sharing: true
    warmup_models: ["fetal_clip", "embedding"]
    
  # 内存管理配置
  memory_management:
    torch_cuda_empty_cache: true
    max_model_memory_mb: 8192
    enable_gradient_checkpointing: true

# 答案生成配置
generator:
  # llm_provider: "xiaohumini_llm_api" # 用于生成答案的LLM
  llm_provider: "medical_vllm_api" # 用于生成答案的LLM
  # llm_provider: "my_qwen_llm" # 用于生成答案的LLM
  # 动态上下文长度控制参数
  context_control:
    model_max_len: 10240
    image_token_cost: 2500
    prompt_overhead_cost: 1500
    answer_cost: 1000
    chars_per_token: 1.8
  # 答案后处理
  postprocessor:
    max_length: 200 # 答案最大长度
  # 图像处理
  image_processing:
    max_images: 3 # 最多加载的图片数量

# 评估输入文件路径

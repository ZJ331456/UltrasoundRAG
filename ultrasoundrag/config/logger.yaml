version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/rag_engine.log  # 将由logger.py动态设置实际路径
    maxBytes: 10485760  # 10MB
    backupCount: 5  # 保留 5 个备份文件
    encoding: utf-8

loggers:
  # 根日志器 - 捕获所有未明确配置的日志
  "":
    level: INFO
    handlers: [console, file]
    propagate: false
    
  # MedicalRAG 相关模块
  MedicalRAG:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  MedicalRAG.index:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  MedicalRAG.utils:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  MedicalRAG.retrieval:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  MedicalRAG.eval:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  MedicalRAG.medicalrag:
    level: INFO
    handlers: [console, file]
    propagate: false

# 第三方库日志级别控制
  urllib3:
    level: WARNING
    handlers: [console]
    propagate: false
    
  requests:
    level: WARNING
    handlers: [console]
    propagate: false
    
  transformers:
    level: WARNING
    handlers: [console]
    propagate: false

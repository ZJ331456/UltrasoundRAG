version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: D:/pycharm/rag-engine/logs/rag_engine.log
    maxBytes: 10485760  # 10MB
    backupCount: 5  # 保留 5 个备份文件
    encoding: utf-8

loggers:
  "":
    level: INFO
    handlers: [console, file]
    propagate: false
  src.retriever:
    level: INFO
    handlers: [console, file]
    propagate: false
  src.generator:
    level: INFO
    handlers: [console, file]
    propagate: false
  src.postprocessing:
    level: INFO
    handlers: [console, file]
    propagate: false
  src.evaluation:
    level: INFO
    handlers: [console, file]
    propagate: false
  src.main:
    level: INFO
    handlers: [console, file]
    propagate: false

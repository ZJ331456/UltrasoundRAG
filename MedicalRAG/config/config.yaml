# 索引创建的总配置
indexing:
  # 文档索引配置
  document:
    input_dir: "data/processed"
    nodes_file: "data/processed/nodes.jsonl" # 解析后节点文件的输出路径
    vectorstore_path: "data/book_vectorstore"
    collection_name: "medical_rag_custom"
  # 图片索引配置
  image:
    nodes_file: "data/processed/image/image_nodes.jsonl"
    base_path: "data/processed/image"
    vectorstore_path: "data/image_vectorstore_clip_taiyi"
    collection_name: "image_features_clip_vit"
    model_path: "models/fetal-clip/dataset2-pretrain/final_model.pt"
    config_path: "models/fetal-clip/config.json"
    batch_size: 32

# Embedding 模型配置
embedding:
  provider: "bge_zh_local_embedding" # 通过此名称在下方的 embedding_providers 中查找模型

# 重排序配置
rerank:
  enabled: true  # 是否启用重排序
  
  # 重排序器类型: "model_based" (使用本地Cross-Encoder) 或 "llm_based" (使用大语言模型)
  type: "llm_based" 

  # --- model_based reranker config (当 type 为 "model_based") ---
  model_path: "models/Qwen3-Reranker-0.6B"
  top_n: 3 # Reranker返回的结果数
  device: "cpu"  # 或 "cuda"
  batch_size: 1

  # --- llm_based reranker config (当 type 为 "llm_based") ---
  # 在 llm_providers 中定义的LLM provider名称
  llm_provider: "xiaohumini_llm_api" 
  # "basic", "advanced", "explanation", "medical", "auto"
  prompt_type: "auto" 

# 检索器配置
retriever:
  top_k: 10  # 检索返回的文档数量
  similarity_threshold: 0.5  # 相似度阈值

# 答案生成配置
generator:
  llm_provider: "xiaohumini_llm_api" # 用于生成答案的LLM
  # llm_provider: "medical_vllm_api" # 用于生成答案的LLM
  # llm_provider: "qwen_vl_api" # 用于生成答案的LLM
  # 动态上下文长度控制参数
  context_control:
    model_max_len: 10240
    image_token_cost: 2500
    prompt_overhead_cost: 1500
    answer_cost: 1000
    chars_per_token: 1.8
  # 答案后处理
  postprocessor:
    max_length: 200 # 答案最大长度
  # 图像处理
  image_processing:
    max_images: 3 # 最多加载的图片数量

# 评估输入文件路径
evaluator:
  input_eval_file: "results/retrival/medical_rag_results_20250708_151646.json"

# 提示工程配置
prompt_engineer:
  language: "zh"


    type: local
    params:
      model_name: "models/bge-small-zh-v1.5"
      device: "cuda"
      batch_size: 32
      max_length: 512

  # 配置一个通过vLLM或OpenAI标准API部署的模型
  openai_api_embedding:
    type: api
    params:
      api_url: "https://xiaohumini.site/v1"
      api_key: "sk-wvCLuRHyTbcJtsb4tNmLckcrESx3CMQw7ufwuIUBrNMNoDD2"
      model_name: "text-embedding-ada-002"
      batch_size: 128

# 图像检索配置
image_retrieval:
  text_embedding_model: "models/bge-small-zh-v1.5"
  chroma_persist_dir: "data/image_vectorstore_clip_taiyi"
  collection_name: "image_features_clip_vit"
  image_base_path: "data/processed/image"

# 多模态配置
multimodal:
  embedding_strategy: "text_image_concat"
  
#   # 图片处理
  image_processing:
    max_size: [512, 512]  # 图片最大尺寸
    quality: 85  # JPEG质量
    timeout: 30  # 下载超时时间
  
#   # 图片描述模型
  image_description:
    model: "gpt-4-vision-preview"  # 或 gpt-4o
    max_tokens: 500
    temperature: 0.3
  
#   # ChromaDB集合
  chroma_collection: "multimodal_documents"

# RAG检索配置
multimodal_retrieval:
  top_k: 5
  include_images: true
  similarity_threshold: 0.3



# 文档处理相关
document:
  input_dir: "./data/processed"  # 输入 markdown 文档路径
  vectorstore_path: "./data/book_vectorstore"  # 向量数据库存储路径
  collection_name: "medical_rag_custom"  # ChromaDB 集合名称
  # collection_name: "02_Standard_section_qwen"  # ChromaDB 集合名称
  # collection_name: "all_Guide_knowledge_base"  # ChromaDB 集合名称
  # model_name: "Qwen/Qwen-3B-Embedding
  # model_dir: "./models/Qwen3-Embedding-0.6B"
  # model_dir: "./models/bge-small-zh-v1.5"  # 嵌入模型本地路径
# ChromaDB 配置
chroma:
  db_path: "./data/book_vectorstore"  # ChromaDB存储路径
  distance_metric: "cosine"  # 距离度量方式：cosine, l2, ip
# Embedding 模型配置
embedding:
  provider: "bge_zh_local_embedding" # 通过此名称在下方的 embedding_providers 中查找模型

# 重排序配置
rerank:
  enabled: false  # 是否启用重排序
  model_path: "./models/Qwen3-Reranker-0.6B"
  device: "cpu"  # 或 "cuda"
  batch_size: 1
# 检索器配置
retriever:
  top_k: 3  # 检索返回的文档数量
  similarity_threshold: 0.5  # 相似度阈值

# 检索答案生成配置
generator:
# # xiaohumini
#   api_url: "https://xiaohumini.site/v1"
#   api_key: "sk-wvCLuRHyTbcJtsb4tNmLckcrESx3CMQw7ufwuIUBrNMNoDD2"
# do
  # chat_model: "gpt-4"
  max_tokens: 1024
  temperature: 0.6
  model_name: "gpt-4o"
  embedding_model_name: "text-embedding-3-small"  # 嵌入模型名称
  max_context_length: 10000 # 最大上下文长度

# 评估输入文件路径
evaluator:
  input_eval_file: "./results/retrival/query_results_20250704_164234.json"  # 输入评估文件路径
# 提示工程配置
prompt_engineer:
  language: "zh"  # 提示语言（zh 或 en）

# 答案后处理配置
postprocessor:
  max_length: 200  # 答案最大长度


# 大语言模型提供者配置
